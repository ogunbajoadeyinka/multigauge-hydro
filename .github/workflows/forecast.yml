name: daily forecasts
# Issues forecasts for every basin configured under forecasts/ (see docs/forecasting.md)
# and commits latest.json / history.csv so the dashboard shows them.
on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC daily (about 5-6 am in Oklahoma)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Any basins configured?
        id: check
        run: echo "has=$(ls forecasts/*/basin.json >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.has == 'true'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.has == 'true'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[download]"
      - if: steps.check.outputs.has == 'true'
        run: multigauge forecast-run forecasts/
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      - name: Commit forecasts
        if: steps.check.outputs.has == 'true'
        run: |
          git config user.name "multigauge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecasts/
          git diff --cached --quiet || git commit -m "Daily forecasts $(date -u +%F)"
          git push

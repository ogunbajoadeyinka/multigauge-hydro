[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multigauge-hydro"
version = "0.2.1"
description = "Measure how much local rain gauges add to pre-trained deep-learning streamflow models: fine-tuning, gauge value, sub-basin routing, probabilistic forecasts and a physics-guided hybrid."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adeyinka Ogunbajo" }]
keywords = ["hydrology", "streamflow", "LSTM", "rain gauge", "machine learning", "Voronoi", "flood forecasting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "shapely>=2.0",
    "torch>=2.0",
    "plotly>=5.24",
    "pyshp>=2.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
download = ["requests>=2.28"]
dev = ["pytest>=7", "streamlit>=1.35", "requests>=2.28"]

[project.scripts]
multigauge = "multigauge.cli:main"

[project.urls]
Homepage = "https://github.com/ogunbajoadeyinka/multigauge-hydro"
Issues = "https://github.com/ogunbajoadeyinka/multigauge-hydro/issues"
Dashboard = "https://multigauge-hydro.streamlit.app"
DOI = "https://doi.org/10.5281/zenodo.23986756"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multigauge = ["pretrained/*/*.json", "pretrained/*/*.pt", "pretrained/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multigauge-hydro"
version = "0.1.0"
description = "Compare how single-gauge, lumped, Voronoi-weighted and spatially disaggregated rainfall inputs affect LSTM streamflow prediction, for any watershed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adeyinka Ogunbajo" }]
keywords = ["hydrology", "streamflow", "LSTM", "rain gauge", "machine learning", "Voronoi", "flood forecasting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "shapely>=2.0",
    "torch>=2.0",
    "plotly>=5.24",
    "pyshp>=2.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
download = ["requests>=2.28"]
dev = ["pytest>=7", "streamlit>=1.35", "requests>=2.28"]

[project.scripts]
multigauge = "multigauge.cli:main"

[project.urls]
Homepage = "https://github.com/ogunbajoadeyinka/multigauge-hydro"
Issues = "https://github.com/ogunbajoadeyinka/multigauge-hydro/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
